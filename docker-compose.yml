# ============================================================
# docker-compose.yml — Mitta AI 智能助理一键部署
# 启动全部服务：docker-compose up -d
# 仅启动基础设施：docker-compose up -d postgres redis etcd minio milvus
# 停止：docker-compose down
# 查看日志：docker-compose logs -f api
# ============================================================

version: "3.8"

services:
  # ==================== PostgreSQL ====================
  # LangGraph Checkpointer（会话状态/短期记忆）+ Store（长期记忆/用户档案）
  postgres:
    image: postgres:16-alpine
    container_name: mitta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mitta}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis（含 RedisSearch 模块） ====================
  # 节点级缓存 + 检索缓存（CacheService 使用 FT.CREATE/FT.SEARCH）+ JWT 登录态 + 限流计数
  # 必须使用 redis-stack 镜像（含 RedisSearch/RedisJSON 模块），标准 redis 镜像不支持 FT.* 命令
  redis:
    image: redis/redis-stack:7.2.0-v10
    container_name: mitta-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"  # RedisInsight Web UI（可选，调试用）
    volumes:
      - redis_data:/data
    environment:
      REDIS_ARGS: "--appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis-Memory（Mem0 长期记忆专用，独立实例） ====================
  # 与业务 redis 隔离：业务实例 maxmemory-policy=allkeys-lru（256MB），LRU 会逐出低频 key；
  # mem0 记忆是不可重建的用户长期事实（对比缓存/登录态），必须独立实例 + noeviction，
  # 否则记忆会被 LRU 静默逐出（数据丢失）。redis-stack 含 RedisSearch，mem0 redis 后端
  # 的 search 会自动做 BM25+向量混合检索。
  redis-memory:
    image: redis/redis-stack:7.2.0-v10
    container_name: mitta-redis-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_memory_data:/data
    environment:
      REDIS_ARGS: "--appendonly yes --maxmemory 256mb --maxmemory-policy noeviction"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Milvus 三件套已停用（项目用 chroma 本地存储，1.6G 内存不跑 milvus）
  # etcd / minio / milvus 全部注释，需要时取消注释即可
  # ==================== 后端 API ====================
  api:
    # image 字段指向 ACR 仓库，CI/CD 部署时 docker compose pull 拉取此镜像
    image: ${ACR_REGISTRY:-crpi-rjfdxfxwof9l3xex.cn-hangzhou.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-qianyiaaa}/${IMAGE_REPO:-mitta}:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitta-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRESQL_DB_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?必须在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mitta}?sslmode=disable
      REDIS_DB_URL: redis://redis:6379/0
      # Mem0 记忆后端：默认 chroma（本地文件库，零外部依赖）；
      # 切 redis 时置 MEMORY_VECTOR_STORE=redis（独立 redis-memory 实例，noeviction 防驱逐）
      MEMORY_VECTOR_STORE: ${MEMORY_VECTOR_STORE:-chroma}
      MEMORY_REDIS_URL: ${MEMORY_REDIS_URL:-redis://redis-memory:6379/0}
      HUNYUAN_API_KEY: ${HUNYUAN_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-Mitta}
      # 密码找回验证码邮件：真实值一律走服务器 .env / 环境变量，勿硬编码进仓库
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-memory:
        condition: service_healthy
    volumes:
      - ./resources/config:/app/resources/config
      - ./resources/system_prompt:/app/resources/system_prompt
      - ./resources/chroma_db:/app/resources/chroma_db
      # 知识库挂载：.md 变更无需重建镜像，CI rsync 后容器内直接读最新入库脚本与文档
      - ./resources/knowledge-base:/app/resources/knowledge-base
      - ./logs:/app/logs

  # ==================== 前端 Nginx（静态托管 + API 反代 + HTTPS）====================
  nginx:
    image: nginx:1.27-alpine
    container_name: mitta-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./resources/frontend:/usr/share/nginx/html:ro
      - ./resources/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api

# ==================== 数据卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redis_memory_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local
