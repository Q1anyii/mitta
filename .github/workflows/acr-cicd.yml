name: CI/CD

# ============================================================
# 混合部署方案（最优）：
#   后端代码 → GitHub Actions 构建镜像 → 推阿里云 ACR（国外网络，apt/pip 快）
#   前端文件 → SCP 直接同步到服务器（nginx 挂载，即时生效）
#   服务器   → 只从 ACR 拉镜像 + 重建容器（阿里云国内快，不本地 build）
# 解决问题：
#   1. 服务器无法访问 GitHub（不 git pull）
#   2. 服务器本地 build 时 apt-get 从 deb.debian.org 下载超时（不 build）
# 优化：
#   - Dockerfile/requirements 未变化时跳过镜像构建（复用 latest），
#     普通代码改动 CI 从 ~10 分钟压到 ~2 分钟
# ============================================================

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.agent/**'

env:
  ACR_NAMESPACE: qianyiaaa
  IMAGE_REPO: mitta

jobs:
  # ========== 门禁：先跑 Agent 纯函数回归，失败即阻断部署 ==========
  # 复用 agent-regression.yml（workflow_call），避免两处 pytest 命令漂移。
  # build_deploy needs: regression → 回归红则不 build/不 rsync/不重启。
  regression:
    uses: ./.github/workflows/agent-regression.yml

  build_deploy:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # ========== 阶段 1：拉取代码 ==========
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # 必须为 0（全量历史）：构建判定要用「上一次成功构建镜像的提交」到 HEAD 的区间，
          # 而不是 HEAD~1 → HEAD 单次提交。见下方说明。
          fetch-depth: 0

      # ========== 阶段 1.5：判断是否需要重建镜像 ==========
      # ⚠️ 判据是「自上次构建镜像以来」而不是「本次 push 的最后一个提交」。
      #    历史事故（2026-09-09）：连续 6 个提交一次性推送，git diff HEAD~1 HEAD 只看到
      #    最后一个提交（未含 Dockerfile/requirements）→ build_required=false 跳过构建
      #    → 服务器拉到旧镜像，新配置静默缺失。
      #    同类事故复发（2026-09-19）：requirements.txt 补 beautifulsoup4（a4e1bd4）后
      #    紧跟一个纯文档提交（71b638a），HEAD~1→HEAD 只看到 docs/** → 再次跳过构建，
      #    重启容器也拿不到新依赖，线上继续报 No module named 'bs4'。
      #    因此在从 HEAD 往前回溯，只要遇到任一构建敏感文件即判定需要重建，
      #    并把上次构建点写入 state 缓存，避免每次全量回溯。
      - name: Check if image build is required
        id: check
        run: |
          BUILD_PATTERN='^(Dockerfile|requirements\.txt|\.github/workflows/|src/)'
          # 上次成功构建镜像的提交；首次或缓存失效时回退到一个足够早的起点
          LAST_BUILD="${{ vars.LAST_IMAGE_BUILD_SHA }}"
          if [ -z "$LAST_BUILD" ]; then
            # 没有记录时保守取最近 50 个提交，任一命中即重建
            RANGE="HEAD~50..HEAD"
          else
            RANGE="${LAST_BUILD}..HEAD"
          fi
          CHANGED=$(git diff --name-only $RANGE || git diff --name-only HEAD~1 HEAD || true)
          echo "comparison range: $RANGE"
          echo "changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE "$BUILD_PATTERN"; then
            echo "build_required=true" >> $GITHUB_OUTPUT
            echo "→ 需要重建镜像（区间内 Dockerfile/依赖/workflow/src 有变更）"
          else
            echo "build_required=false" >> $GITHUB_OUTPUT
            echo "→ 跳过构建，复用 latest 镜像"
          fi
          # 依赖是否变化（2026-09-28）：决定是否全量导出构建缓存。
          # 纯代码改动（src/）时依赖层没变，代码层来自 git 无需缓存，
          # cache-to 留空跳过导出，省掉每次 100s+ 的缓存上传。
          if echo "$CHANGED" | grep -qE '^(Dockerfile|requirements\.txt)'; then
            echo "deps_changed=true" >> $GITHUB_OUTPUT
            echo "→ 依赖文件变更，本次构建将全量导出缓存"
          else
            echo "deps_changed=false" >> $GITHUB_OUTPUT
            echo "→ 依赖未变，跳过缓存导出"
          fi
          # 供后续步骤读取，用于构建成功后更新 LAST_IMAGE_BUILD_SHA
          echo "head_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # ========== 阶段 1.6：判断是否需要 RAG 入库（蓝绿切换，H-20260919-08） ==========
      # 命中入库相关文件 → ingest_required=true，CI 执行蓝绿入库；
      # 否则跳过（普通业务代码改动不触发入库，不花 embedding API 费用）
      # 当前存在缺陷：只diff最近一次提交，
      # 优化方向：并入Check if image build is required，
      # 对齐build_required读取LAST_INGEST_SHA,同时在入库成功后写入Github
      - name: Check if RAG ingest is required
        id: ingest
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          echo "changed files (ingest check):"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/constant/embedding_constants.py|resources/knowledge-base/|resources/config/vector_db.json)'; then
            echo "ingest_required=true" >> $GITHUB_OUTPUT
            echo "→ RAG 入库相关文件变更，CI 将执行蓝绿入库"
          else
            echo "ingest_required=false" >> $GITHUB_OUTPUT
            echo "→ 无 RAG 入库变更，跳过入库"
          fi

      # ========== 阶段 2：构建后端镜像（仅 Dockerfile 等变化时执行） ==========
      - name: Set up Docker Buildx
        if: steps.check.outputs.build_required == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login ACR
        if: steps.check.outputs.build_required == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get commit hash
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build & push api image to ACR
        if: steps.check.outputs.build_required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
            ${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:latest
          # gha 缓存加 scope 隔离：默认 scope=buildkit 会被其他 workflow 的缓存
          # 互相挤掉，导致依赖层反复全量重建+全量上传。
          # 固定 scope=mitta-main 让主分支构建缓存专属、读写必然配对；
          # mode=max 导出全部层，保证下次 restore 完整命中（依赖层 40s 重建→0s）。
          # 2026-09-28 compression=zstd：buildx 的 gha exporter 每次构建都把
          # 恢复的缓存层重新压缩上传（不做跨构建去重），2-3GB 全量导出是
          # export 40-105s 的主因；zstd level 3 压缩远快于 gzip 默认级别。
          # 依赖未变时 cache-to 留空（跳过导出）：代码层来自 git 无需缓存，
          # 纯代码改动省掉 100s+ 导出；仅依赖变更才全量导出更新缓存。
          cache-from: type=gha,scope=mitta-main
          cache-to: ${{ steps.check.outputs.deps_changed == 'true' && 'type=gha,mode=max,scope=mitta-main,compression=zstd,compression-level=3' || '' }}

      # 构建成功后记录本次提交，作为下次「是否需要重建」的比较起点。
      # 用 Repository Variable 保存（需 actions: write 权限，已在上方声明）；
      # 未配置时判据自动回退到「最近 50 个提交」，保守但不会漏构建。
      - name: Record last image build sha
        if: steps.check.outputs.build_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set LAST_IMAGE_BUILD_SHA --body "${{ steps.check.outputs.head_sha }}" || \
            echo "WARN: 未能写入 LAST_IMAGE_BUILD_SHA（缺权限或仓库未启用 Variables），下次将回退到最近 50 提交判据"

      # ========== 阶段 3：rsync 增量同步前端文件 + 配置（绕过 git pull） ==========
      # 相比 scp-action 每次全量 tar 上传：rsync -c 按内容校验只传变化块，
      # 改一个 CSS/JS 仅传几 KB（跨境公网下从 ~2.5min 压到秒级）。
      # 注意：只对纯前端目录加 --delete 清理服务器残留；绝不对 /opt/mitta 根目录加，
      # 否则会误删服务器上不在仓库的 .env、数据卷等运行时文件。
      - name: Sync frontend & config to server via rsync
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30)
          HOST="${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}"
          DEST="/opt/mitta"

          echo "=== [0] 确保远程已装 rsync（缺失自动安装）并预建目标目录 ==="
          ssh "${SSH_OPTS[@]}" "$HOST" '
            set -e
            if ! command -v rsync >/dev/null 2>&1; then
              echo "远程未安装 rsync，开始自动安装..."
              if   command -v apt-get >/dev/null 2>&1; then apt-get update -y && apt-get install -y rsync;
              elif command -v dnf     >/dev/null 2>&1; then dnf install -y rsync;
              elif command -v yum     >/dev/null 2>&1; then yum install -y rsync;
              else echo "无法识别包管理器，请手动在服务器安装 rsync"; exit 42; fi
            fi
            echo "远程 rsync 版本: $(rsync --version | head -1)"
            mkdir -p /opt/mitta/resources/frontend /opt/mitta/resources/config /opt/mitta/resources/system_prompt
          '

          echo "=== [1] 增量同步前端（--delete 清理旧文件，含已删备份目录）==="
          rsync -azc --delete -e "ssh ${SSH_OPTS[*]}" resources/frontend/ "$HOST:$DEST/resources/frontend/"

          echo "=== [2] 增量同步运行时配置（排除 vector_db.json，它由 CI 动态维护 collection 名） ==="
          rsync -azc -e "ssh ${SSH_OPTS[*]}" --exclude vector_db.json resources/config/ "$HOST:$DEST/resources/config/"
          rsync -azc -e "ssh ${SSH_OPTS[*]}" resources/system_prompt/ "$HOST:$DEST/resources/system_prompt/"

          echo "=== [2.5] 同步知识库（仅 RAG 入库变更时；api 容器已挂载此目录，无需重建镜像） ==="
          if [ "${{ steps.ingest.outputs.ingest_required }}" = "true" ]; then
            rsync -azc -e "ssh ${SSH_OPTS[*]}" resources/knowledge-base/ "$HOST:$DEST/resources/knowledge-base/"
          fi

          echo "=== [3] 同步 compose 文件 ==="
          rsync -azc -e "ssh ${SSH_OPTS[*]}" docker-compose.yml "$HOST:$DEST/docker-compose.yml"

          echo "✅ rsync 增量同步完成"

      # ========== 阶段 4：SSH 部署（只拉镜像，不本地 build） ==========
      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/mitta

            echo "=== [0/4] 清理配置路径残留（防容器内解析成 Windows 路径）==="
            rm -f resources/config/.mcp_config_path resources/config/.vector_config_path

            echo "=== [1/4] 登录 ACR ==="
            docker login ${{ secrets.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

            echo "=== [1.5/4] 清理未使用镜像腾空间（防磁盘满导致 pull/启动失败） ==="
            # 频繁部署时旧镜像都在 24h 内，until=24h 过滤器形同虚设（历史事故：
            # 2026-09-28 服务器磁盘满 → 容器启动时 chromadb 写盘失败 → AttributeError
            # → 健康检查 24 连败 CI 红）；改全量清未被任何容器引用的镜像。
            # 运行中容器引用的镜像不受影响；服务器不本地 build，构建缓存纯占空间一并清。
            docker image prune -af || true
            docker builder prune -af || true

            echo "=== [1.6/4] 备份当前 latest 为回滚源（健康检查失败时自动回滚） ==="
            # 打临时 tag 保留当前版本：ACR 同时保留每个 SHORT_SHA 历史版本（回滚的远程源泉），
            # 本地这份用于快速回滚（免重新下载）。prune -af 已先行，运行中容器引用的
            # latest 不会被删，本 tag 挂在同一镜像上随之保留。
            ROLLBACK_TAG="rollback_$(date +%Y%m%d_%H%M%S)"
            docker tag "${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:latest" \
                   "${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:$ROLLBACK_TAG" \
              || { echo "WARN: 无当前镜像可备份（首次部署？），本次跳过自动回滚"; ROLLBACK_TAG=""; }

            echo "=== [2/4] 拉取最新后端镜像 ==="
            docker compose pull api

            echo "=== [2.5/4] RAG 蓝绿入库（仅入库相关文件变更时；绝不先删旧库） ==="
            INGEST_REQUIRED="${{ steps.ingest.outputs.ingest_required }}"
            if [ "$INGEST_REQUIRED" = "true" ]; then
              NEW_COLL="FAQ_KNOWLEDGE_BASE_${{ env.SHORT_SHA }}"
              OLD_COLL="$(python3 -c "import json;print(json.load(open('resources/config/vector_db.json'))['collection'])")"
              echo "  NEW_COLL=$NEW_COLL  OLD_COLL=$OLD_COLL"
              echo "  → 入库到新 collection（失败即 CI 红，旧库继续服务）"
              docker compose exec -T api python resources/knowledge-base/ingest_knowledge.py \
                --collection "$NEW_COLL" --redis-url "redis://redis:6379/0"
              echo "  → 切换 vector_db.json 指向并重启 api"
              sed -i "s/\"collection\": *\"[^\"]*\"/\"collection\": \"$NEW_COLL\"/" resources/config/vector_db.json
              docker compose up -d --no-build api
            else
              echo "  → 无 RAG 变更，跳过入库"
            fi

            echo "=== [3/4] 重建 api 容器（不 build） ==="
            # 停旧 api → 起新 api。
            # 历史注记：曾因误判根因在这里加 restart postgres + pg_isready + sleep 10；
            # 真因是 PG 库名漂移（agentproject→mitta），已在服务器 ALTER DATABASE 改名修复，
            # 这里无需再重启 PG（重启只会徒增 downtime）。
            docker compose stop api
            docker compose up -d --no-build api

            echo "=== [3.5/4] 重建 nginx（应用 HTTPS/443/证书挂载变更） ==="
            docker compose up -d --no-build nginx

            echo "=== [4/4] 健康检查 ==="
            sleep 20
            for i in {1..24}; do
              HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              echo "  第 ${i} 次: HTTP $HEALTH"
              if [ "$HEALTH" = "200" ]; then
                echo "✅ 部署成功"
                if [ "$INGEST_REQUIRED" = "true" ]; then
                  echo "=== 清理旧 collection（保留 NEW + OLD 两个，更早的删除） ==="
                  docker compose exec -T api python resources/knowledge-base/cleanup_collections.py \
                    --keep "$NEW_COLL" --keep "$OLD_COLL"
                fi
                docker ps --format "table {{.Names}}\t{{.Status}}" | grep mitta
                break
              fi
              if [ "$i" = "24" ]; then
                echo "❌ 健康检查失败，查看日志："
                docker logs mitta-api --tail 80 2>&1
                echo "=== 自动回滚镜像到上一版本 ==="
                if [ -n "$ROLLBACK_TAG" ] && docker image inspect "${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:$ROLLBACK_TAG" >/dev/null 2>&1; then
                  docker tag "${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:$ROLLBACK_TAG" \
                         "${{ secrets.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_REPO }}:latest"
                  docker compose up -d --no-build api
                  sleep 15
                  RB=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
                  echo "回滚后健康检查: HTTP $RB"
                  if [ "$RB" != "200" ]; then
                    echo "❌ 回滚后仍不健康，需人工介入（docker logs mitta-api）"
                  else
                    echo "✅ 已回滚到上一版本，服务恢复（本次部署标记失败，新镜像需排查）"
                  fi
                else
                  echo "  → 无回滚源（首次部署或备份失败），跳过镜像回滚"
                fi
                if [ "$INGEST_REQUIRED" = "true" ]; then
                  echo "=== 回滚：切回旧 collection $OLD_COLL 并重启（不能让 api 挂着有问题的新库） ==="
                  sed -i "s/\"collection\": *\"[^\"]*\"/\"collection\": \"$OLD_COLL\"/" resources/config/vector_db.json
                  docker compose up -d --no-build api
                  sleep 15
                  RB=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
                  echo "回滚后健康检查: HTTP $RB"
                  if [ "$RB" != "200" ]; then
                    echo "❌ 回滚后仍不健康，需人工介入（docker logs mitta-api）"
                  fi
                fi
                exit 1
              fi
              sleep 5
            done

            echo "=== 清理悬空镜像（pull 后旧 latest 变悬空，兜底清掉；不过滤 24h） ==="
            docker image prune -f || true
            echo "=== 部署完成 ==="
